name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 测试
        run: pytest -q
      - name: 冒烟：跑通全部示例
        run: |
          python examples/01_quickstart.py
          python examples/02_batch_recipes.py
          python examples/03_custom_primitive.py
      - name: 冒烟：CLI 端到端
        run: |
          pixsmith list --json
          pixsmith show star
          pixsmith render gradient --size 64x64 --set end=#00FF00 -o smoke.png
          pixsmith gallery --out _gallery --size 48x32
