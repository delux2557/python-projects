[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixsmith"
version = "0.6.0"
description = "用代码生成背景 / 底纹 / 装饰件，输出 PNG 或 SVG —— 不找素材、可复现、对 AI agent 友好"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "delux2557", email = "85469583+delux2557@users.noreply.github.com" },
]
keywords = ["png", "svg", "procedural", "texture", "background", "generative",
            "numpy", "asset", "ai-agent", "deterministic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pixsmith = "pixsmith.cli:main"
pixsmith-mcp = "pixsmith.mcp_server:main"

[project.urls]
Homepage = "https://github.com/delux2557/pixsmith"
Source = "https://github.com/delux2557/pixsmith"
Issues = "https://github.com/delux2557/pixsmith/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pixsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
